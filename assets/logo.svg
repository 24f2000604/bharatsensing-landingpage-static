<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="BharatSensing radar mark">
  <title>BharatSensing</title>
  <defs>
    <linearGradient id="bs-sweep" x1="50%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="32" cy="32" r="27" stroke="#FF7A00" stroke-width="2.4"/>
  <!-- inner ring (signal range) -->
  <circle cx="32" cy="32" r="15" stroke="#FF7A00" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- radar sweep wedge: 12 to 3 o'clock -->
  <path d="M32 32 L32 5 A27 27 0 0 1 59 32 Z" fill="url(#bs-sweep)"/>
  <!-- sweep edges -->
  <line x1="32" y1="32" x2="32" y2="5" stroke="#FF7A00" stroke-width="2"/>
  <line x1="32" y1="32" x2="59" y2="32" stroke="#FF7A00" stroke-width="2" stroke-opacity="0.55"/>
  <!-- core dot -->
  <circle cx="32" cy="32" r="3.6" fill="#FF7A00"/>
</svg>
